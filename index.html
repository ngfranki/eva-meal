<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>飲食記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="飲食記錄">
<meta name="theme-color" content="#FAF6EB">
<style>
  :root{
    --bg:#FAF6EB; --ink:#3B3A19; --gold:#CEB991; --warn:#C0553B; --card:#FFFFFF;
    --muted:#8A876A; --line:#ECE5D3; --soft:#F4EFE2; --gold-soft:#F1E9D6;
    --c:#8FAF86; --c-soft:#E9F0E4; --p:#D98E6B; --p-soft:#F8E6DC; --f:#DDB85A; --f-soft:#F8EFD2; --fb:#9DAEBE; --fb-soft:#E6ECF1;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(59,58,25,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1C1B14; --ink:#EDE8D6; --gold:#CEB991; --warn:#D4735B; --card:#26251C;
      --muted:#A39F86; --line:#3A382B; --soft:#302E22; --gold-soft:#3A3526;
      --c:#9FBF95; --c-soft:#2A3327; --p:#E29A78; --p-soft:#3D2C24; --f:#E5C46A; --f-soft:#3B3422; --fb:#A9BACB; --fb-soft:#2A3138;
      --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,"PingFang HK",sans-serif; font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom)}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0}
  .app{max-width:480px; margin:0 auto; padding:14px 16px 104px}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.02em}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0 12px}
  .top h1{font-size:22px; margin:0; font-weight:800; letter-spacing:-.01em}
  .top .r{display:flex; align-items:center; gap:8px}
  .sync{font-size:12px; color:var(--muted); white-space:nowrap}
  .sync.err{color:var(--warn)}
  .gear{width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:16px}
  .upd{display:none; background:var(--ink); color:var(--bg); font-size:13px; padding:10px 12px; border-radius:14px; margin-bottom:12px; text-align:center; cursor:pointer}
  .upd.show{display:block}
  .ver{font-size:10px; color:var(--muted); text-align:center; padding:14px 0 0}
  .offline{display:none; background:var(--warn); color:#fff; font-size:13px; padding:9px 12px; border-radius:14px; margin-bottom:12px; text-align:center}
  .offline.show{display:block}

  /* week strip */
  .datenav{margin:0 0 14px}
  .wk-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
  .wk-top .d{font-size:15px; font-weight:700}
  .wk-top .d small{font-weight:500; color:var(--muted); margin-left:6px; font-size:12px}
  .wk-top .arrows button{width:32px; height:32px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:16px; margin-left:6px}
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .week button{background:var(--card); border-radius:14px; padding:8px 0 7px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:1px; position:relative}
  .week button span{font-size:11px; color:var(--muted)}
  .week button b{font-size:16px; font-weight:800}
  .week button i{position:absolute; top:6px; right:8px; width:5px; height:5px; border-radius:50%; background:var(--gold)}
  .week button.on{background:var(--ink); color:var(--bg)}
  .week button.on span{color:var(--bg); opacity:.7}
  .week button.on i{background:var(--gold)}
  .week button.today:not(.on) b{color:var(--p)}

  /* cards */
  .card{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .card h2{font-size:15px; margin:0; font-weight:800}
  .sech{display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 10px}
  .sech h2{font-size:17px; margin:0; font-weight:800}
  .sech span{font-size:13px; color:var(--muted)}

  /* budget */
  .bh{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .bh .edit{font-size:12px; color:var(--muted); background:var(--soft); border-radius:999px; padding:5px 10px}
  .bgrid{display:grid; grid-template-columns:150px 1fr; gap:14px; align-items:center}
  .ringbox{display:flex; flex-direction:column; align-items:center}
  .ring{position:relative; width:150px; height:150px}
  .ring svg{width:150px; height:150px; transform:rotate(-90deg)}
  .ring .trk{fill:none; stroke:var(--soft); stroke-width:12}
  .ring .val{fill:none; stroke:var(--gold); stroke-width:12; stroke-linecap:round; transition:stroke-dasharray .4s}
  .ring.over .val{stroke:var(--warn)}
  .ring .c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .c small{font-size:12px; color:var(--muted)}
  .ring .c b{font-size:30px; font-weight:800; line-height:1.05}
  .ring .c em{font-style:normal; font-size:12px; color:var(--muted)}
  .ring.over .c b{color:var(--warn)}
  .goal{font-size:12px; color:var(--muted); margin-top:8px}
  .mrows{display:flex; flex-direction:column; gap:10px}
  .mrow{display:flex; align-items:center; gap:10px}
  .mrow .t{flex:1}
  .mrow .t b{font-size:17px; font-weight:800}
  .mrow .t b small{font-size:12px; color:var(--muted); font-weight:500; margin-left:2px}
  .mrow .t span{display:block; font-size:12px; color:var(--muted); margin-top:-2px}
  .mring{position:relative; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px}
  .mring svg{position:absolute; inset:0; width:42px; height:42px; transform:rotate(-90deg)}
  .mring .trk{fill:none; stroke-width:4}
  .mring .val{fill:none; stroke-width:4; stroke-linecap:round}
  .mrow.c .mring{background:var(--c-soft)} .mrow.c .trk{stroke:var(--c-soft)} .mrow.c .val{stroke:var(--c)}
  .mrow.p .mring{background:var(--p-soft)} .mrow.p .trk{stroke:var(--p-soft)} .mrow.p .val{stroke:var(--p)}
  .mrow.f .mring{background:var(--f-soft)} .mrow.f .trk{stroke:var(--f-soft)} .mrow.f .val{stroke:var(--f)}
  .mrow.fb .mring{background:var(--fb-soft)} .mrow.fb .trk{stroke:var(--fb-soft)} .mrow.fb .val{stroke:var(--fb)}
  .mrow.over .t b{color:var(--warn)}

  .net{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
  .net div.d{background:var(--c-soft)} .net div.d.over{background:var(--warn); color:#fff} .net div.d.over span{color:#fff; opacity:.85}
  .ledger{margin-top:12px; background:var(--soft); border-radius:16px; padding:10px 14px}
  .ledger .r{display:flex; align-items:baseline; gap:8px; padding:5px 0; border-top:1px dashed var(--line)}
  .ledger .r:first-child{border-top:0}
  .ledger .op{width:18px; font-weight:800; color:var(--muted)}
  .ledger .lb{flex:1; font-size:14px}
  .ledger .lb small{display:block; font-size:11px; color:var(--muted)}
  .ledger .nm{font-weight:800; font-size:17px; min-width:70px; text-align:right}
  .ledger .r.tot{border-top:2px solid var(--ink); margin-top:4px; padding-top:8px}
  .ledger .r.tot .lb{font-weight:800; font-size:15px}
  .ledger .r.tot .nm{font-size:22px; color:var(--c)}
  .ledger .r.tot.over .nm{color:var(--warn)}
  .ledger .r.sub .nm,.ledger .r.sub .lb{color:var(--muted); font-size:13px}
  .steps{display:flex; align-items:center; gap:8px; margin-top:14px; background:var(--soft); border-radius:14px; padding:8px 10px}
  .steps.y{margin-top:6px; background:transparent; border:1px dashed var(--line)}
  .steps.y input{background:var(--soft)}
  .steps .lbl{font-size:12px; color:var(--muted); white-space:nowrap}
  .steps .ic{font-size:18px}
  .steps input{width:120px; border:0; border-radius:10px; padding:8px 10px; background:var(--card); font-size:16px; font-weight:700}
  .steps .sk{font-size:12px; color:var(--muted); flex:1}
  .net div{background:var(--soft); border-radius:14px; padding:9px 6px; text-align:center}
  .net b{display:block; font-size:17px; font-weight:800}
  .net span{font-size:11px; color:var(--muted)}
  .net div.n{background:var(--gold-soft)}
  /* meals */
  .meal{padding:14px 16px}
  .mh{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px}
  .mt{display:flex; align-items:center; gap:10px}
  .memo{width:40px; height:40px; border-radius:14px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:20px}
  .mt b{font-size:16px; font-weight:800; display:block}
  .mt span{font-size:12px; color:var(--muted)}
  .addbtn{width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--bg); font-size:22px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(59,58,25,.18)}
  .items{margin:8px 0 0; padding:0; list-style:none}
  .items li{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
  .items li:first-child{border-top:1px solid var(--line)}
  .thumb{width:44px; height:44px; border-radius:14px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none}
  .items .n{flex:1; min-width:0}
  .items .n b{font-weight:700; font-size:15px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .items .n span{display:block; font-size:12px; color:var(--muted)}
  .items .kc{font-weight:800; font-size:17px; white-space:nowrap}
  .items .kc small{font-size:11px; color:var(--muted); font-weight:500; margin-left:2px}
  .x{width:30px; height:30px; border-radius:50%; color:var(--muted); font-size:14px; background:var(--soft); flex:none}
  .x.confirm{background:var(--warn); color:#fff; width:auto; padding:0 10px; font-size:12px; font-weight:700; border-radius:999px}
  .items .sub{margin:4px 0 2px 54px; padding:0; list-style:none; border-left:2px solid var(--line)}
  .items .sub li{display:flex; justify-content:space-between; gap:8px; padding:2px 0 2px 8px; border:0; font-size:12px; color:var(--muted)}
  .items .n.tap{cursor:pointer}
  .empty{color:var(--muted); font-size:13px; padding:8px 0 2px}
  .note-in{width:100%; border:0; border-radius:12px; padding:9px 12px; background:var(--soft); font-size:14px; margin-top:10px}
  .savebtn{font-size:12px; color:var(--muted); padding:8px 0 0}

  /* tabbar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:var(--card); border-top:1px solid var(--line); padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:20}
  .tabbar .in{display:flex; width:100%; max-width:480px; padding:0 12px}
  .tabbar button{flex:1; padding:6px 0; font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; border-radius:16px}
  .tabbar button i{font-style:normal; font-size:20px; width:44px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:14px}
  .tabbar button.on{color:var(--ink); font-weight:700}
  .tabbar button.on i{background:var(--gold-soft)}

  /* sheet */
  .veil{position:fixed; inset:0; background:rgba(40,35,20,.4); display:none; z-index:30}
  .veil.show{display:block}
  .sheet{position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:480px; background:var(--bg); border-radius:24px 24px 0 0; box-shadow:0 -6px 30px rgba(0,0,0,.18); max-height:90vh; overflow:auto; padding:14px 16px calc(24px + env(safe-area-inset-bottom)); display:none; z-index:40}
  .sheet.show{display:block}
  .sheet .hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .sheet .hd h2{margin:0; font-size:19px; font-weight:800}
  .close{width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:15px}
  .sec{margin:14px 0 8px; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.04em}
  .quick{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .quick button{background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:12px; text-align:left; min-height:62px; display:flex; gap:10px; align-items:center}
  .quick button .thumb{width:36px; height:36px; font-size:18px; border-radius:12px}
  .quick button b{display:block; font-size:14px; font-weight:700; line-height:1.25}
  .quick button span{display:block; font-size:11px; color:var(--muted); margin-top:2px}
  .sets{display:flex; flex-direction:column; gap:8px}
  .sets .sb{display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--bg); border-radius:18px; padding:12px 14px}
  .sets .sb .t{flex:1; text-align:left}
  .sets .sb b{display:block; font-size:16px; font-weight:800}
  .sets .sb span{font-size:12px; opacity:.75}
  .sets .sb .x{background:rgba(255,255,255,.15); color:var(--bg)}
  .rep{display:flex; gap:8px}
  .rep button{flex:1; background:var(--gold-soft); border-radius:14px; padding:11px; font-size:14px; font-weight:600}
  .nl textarea{width:100%; min-height:64px; border:0; border-radius:16px; padding:12px 14px; background:var(--card); box-shadow:var(--shadow); font-size:16px; resize:vertical}
  .nlrow{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; margin-top:6px}
  .nlrow .h{display:flex; justify-content:space-between; gap:8px; align-items:center}
  .nlrow .h b{font-weight:700}
  .nlrow .h span{font-size:12px; color:var(--muted)}
  .nlrow .kc{font-weight:800; white-space:nowrap}
  .nlrow.bad{border-left:3px solid var(--warn)}
  .nlrow .portions{display:flex; padding:8px 0 0}
  .nlrow .g{display:flex; gap:6px; margin-top:8px; align-items:center}
  .nlrow .g input{width:90px; border:0; border-radius:10px; padding:8px; background:var(--soft); font-size:15px}
  .nlrow .g button{background:var(--soft); border-radius:10px; padding:8px 12px; font-weight:600}
  .search{width:100%; border:0; border-radius:16px; padding:12px 14px; background:var(--card); box-shadow:var(--shadow); font-size:16px}
  .flist{margin:8px 0 0; padding:0; list-style:none}
  .flist li{background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-bottom:6px; overflow:hidden}
  .flist .row{display:flex; align-items:center; gap:10px; padding:10px 12px; width:100%; text-align:left}
  .flist .row .thumb{width:36px; height:36px; font-size:18px; border-radius:12px}
  .flist .row .nm{flex:1}
  .flist .row b{font-weight:700; display:block}
  .flist .row span{font-size:12px; color:var(--muted)}
  .flist .cat{font-size:11px; color:var(--muted); padding:8px 2px 2px; font-weight:700}
  .portions{display:none; gap:8px; padding:0 10px 10px}
  .flist li.open .portions{display:flex}
  .portions button{flex:1; background:var(--gold); color:#3B3A19; border-radius:14px; padding:12px 4px; font-weight:800; font-size:15px}
  .portions button small{display:block; font-weight:500; font-size:11px; opacity:.85}
  .src{font-size:11px; color:var(--muted); padding:0 12px 10px; display:none; word-break:break-all}
  .flist li.open .src{display:block}

  .ring{cursor:pointer}
  .setgoal{margin-top:8px; background:var(--ink); color:var(--bg); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700}
  .grow{display:flex; gap:6px; align-items:center; padding:0 10px 10px}
  .grow input{width:88px; border:0; border-radius:10px; padding:9px 10px; background:var(--soft); font-size:16px; font-weight:700; text-align:right}
  .grow .u{font-size:13px; color:var(--muted)}
  .grow .pk{flex:1; font-size:13px; color:var(--muted); text-align:right}
  .grow .pk b{font-size:16px; color:var(--ink)}
  .grow .go{background:var(--ink); color:var(--bg); border-radius:12px; padding:9px 14px; font-weight:800; font-size:15px}
  .grow .go[disabled]{opacity:.35}
  .portions button.on{outline:2px solid var(--ink)}
  .photo{display:flex; gap:8px}
  .photo button{flex:1; background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px}
  .photo button.dark{background:var(--ink); color:var(--bg)}
  .ai{font-size:11px; color:var(--p); font-weight:700}
  .exchips{display:flex; flex-wrap:wrap; gap:6px}
  .exchips button{background:var(--card); box-shadow:var(--shadow); border-radius:12px; padding:8px 10px; font-size:13px; text-align:left; line-height:1.2}
  .exchips button small{display:block; font-size:10px; color:var(--muted); font-weight:500}
  .exchips button.on{background:var(--ink); color:var(--bg)} .exchips button.on small{color:var(--bg); opacity:.7}
  .est{background:var(--gold-soft); border-radius:12px; padding:9px 12px; font-size:13px; margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .est button{background:var(--ink); color:var(--bg); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700}
  /* forms */
  .frm label{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px}
  .frm input,.frm select,.frm textarea{width:100%; border:0; border-radius:14px; padding:11px 12px; background:var(--card); box-shadow:var(--shadow); font-size:16px}
  .frm .g2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .frm .g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .frm .g5{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .frm .g5 input{padding:8px 6px; font-size:14px}
  .btn{width:100%; background:var(--ink); color:var(--bg); font-weight:800; border-radius:18px; padding:15px; font-size:16px; margin-top:14px}
  .btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--shadow); font-weight:600}
  .btn.warn{background:var(--warn); color:#fff}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chips button{background:var(--card); box-shadow:var(--shadow); border-radius:999px; padding:9px 14px; font-size:14px; font-weight:600}
  .chips button.on{background:var(--ink); color:var(--bg)}
  .setrow{display:grid; grid-template-columns:2fr 1fr 1fr 34px; gap:6px; margin-top:6px; align-items:center}
  .setrow input{padding:8px 8px; font-size:14px}
  .setrow .x{height:34px; width:34px}
  .hint{font-size:12px; color:var(--muted); margin-top:8px}

  /* workouts */
  .wk{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
  .wk:first-of-type{border-top:0}
  .wk .n{flex:1; cursor:pointer}
  .wk .n .hintedit{font-size:11px; color:var(--muted)}
  .wk .n b{font-size:15px; font-weight:700}
  .wk .n .m{font-size:13px; color:var(--muted)}
  .wk .n .sets{font-size:13px; margin-top:4px}
  .wk .n .sets div{padding:1px 0}

  /* trends */
  .chart{display:flex; align-items:flex-end; gap:4px; height:130px; padding-top:10px; position:relative}
  .chart .c{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
  .chart .b{width:100%; background:var(--gold); border-radius:6px; min-height:3px}
  .chart .b.over{background:var(--warn)}
  .chart .b.p{background:var(--p)}
  .chart .b.wk{background:var(--c)}
  .chart.neg{height:150px}
  .chart .bar2{position:relative; width:100%; height:100%}
  .chart .bar2 .b{position:absolute; left:0; right:0; border-radius:4px}
  .chart .bar2 .b.d{background:var(--c)}
  .chart .zero{position:absolute; left:0; right:0; top:calc(50% + 6px); border-top:1px solid var(--line)}
  .chart .v{font-size:9px; color:var(--muted); margin-bottom:2px}
  .chart .l{font-size:9px; color:var(--muted); margin-top:4px}
  .tline{position:absolute; left:0; right:0; border-top:1.5px dashed var(--warn); opacity:.6}
  .tline span{position:absolute; right:0; top:-14px; font-size:10px; color:var(--warn)}
  .stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
  .stat div{background:var(--soft); border-radius:16px; padding:10px 8px; text-align:center}
  .stat b{display:block; font-size:18px; font-weight:800}
  .stat span{font-size:11px; color:var(--muted)}

  /* gate */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; padding:20px}
  .gate.show{display:flex}
  .gate .box{width:100%; max-width:320px; background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:22px}
  .gate h2{margin:0 0 6px; font-size:20px; font-weight:800}
  .gate p{margin:0 0 12px; font-size:13px; color:var(--muted)}
  .gate .search{background:var(--soft); box-shadow:none}
</style>
</head>

  function renderTrend(){
    var days=[], t=today(); for(var i=13;i>=0;i--) days.push(shiftDate(t,-i));
    var s=state.settings, target=+s.dailyKcal||0, tdee=+s.tdee||2300;
    var kc=days.map(function(d){ return totals(dayItems(d)); });
    var steps=days.map(function(d){ return daySteps(d); });
    var deficit=days.map(function(d,i){ var logged=kc[i].kcal>0; return logged? tdee-(kc[i].kcal-dayBurn(d)) : null; });
    function chart(vals, cls, targetV, unit, allowNeg){
      var nums=vals.filter(function(v){return v!=null;});
      var mx=Math.max.apply(null, nums.map(Math.abs).concat([Math.abs(targetV||0), 1]))*1.1, h='<div class="chart'+(allowNeg?' neg':'')+'">';
      if(targetV&&!allowNeg) h+='<div class="tline" style="bottom:'+(targetV/mx*100)+'%"><span>'+targetV+unit+'</span></div>';
      if(allowNeg) h+='<div class="zero"></div>';
      vals.forEach(function(v,i){
        var over=targetV&&v>targetV&&cls==='kc';
        if(allowNeg){
          var hh=v==null?0:Math.abs(v)/mx*50;
          h+='<div class="c"><div class="v">'+(v==null?'':(v>=0?'−':'+')+r0(Math.abs(v)))+'</div><div class="bar2"><div class="b'+(v!=null&&v<0?' over':' d')+'" style="height:'+hh+'%;'+(v!=null&&v<0?'top:50%':'bottom:50%')+'"></div></div><div class="l">'+(+days[i].slice(8))+'</div></div>';
        } else
        h+='<div class="c"><div class="v">'+(v?r0(v):'')+'</div><div class="b'+(over?' over':'')+(cls==='st'?' wk':'')+'" style="height:'+(v/mx*100)+'%"></div><div class="l">'+(+days[i].slice(8))+'</div></div>';
      });
      return h+'</div>';
    }
    var logged=kc.filter(function(x){return x.kcal>0;});
    var avgK=logged.length?r0(logged.reduce(function(a,x){return a+x.kcal;},0)/logged.length):0;
    var stTot=steps.reduce(function(a,b){return a+b;},0), stDays=steps.filter(function(x){return x>0;}).length;
    var defs=deficit.filter(function(v){return v!=null;}); var defAvg=defs.length?r0(defs.reduce(function(a,b){return a+b;},0)/defs.length):0, defSum=r0(defs.reduce(function(a,b){return a+b;},0));
    var h='<div class="card"><h2>近 14 日 卡路里攝取（唔扣運動）</h2>'+chart(kc.map(function(x){return x.kcal;}),'kc',target,'',false)+
      '<div class="stat"><div><b>'+avgK.toLocaleString()+'</b><span>有記錄日均</span></div><div><b>'+logged.length+'</b><span>有記錄日數</span></div><div><b>'+(target||'—')+'</b><span>目標</span></div></div></div>';
    h+='<div class="card"><h2>近 14 日 行路步數</h2>'+chart(steps,'st',0,'',false)+
      '<div class="stat"><div><b>'+(stDays?r0(stTot/stDays).toLocaleString():0)+'</b><span>有記錄日均</span></div><div><b>'+stDays+'</b><span>有記錄日數</span></div><div><b>'+r0(stepsKcal(stDays?stTot/stDays:0))+'</b><span>日均步行 kcal（估）</span></div></div></div>';
    h+='<div class="card"><h2>近 14 日 卡路里赤字（TDEE '+tdee.toLocaleString()+' − 淨攝取）</h2>'+chart(deficit,'df',0,'',true)+
      '<div class="stat"><div><b>'+(defAvg>=0?'−':'+')+Math.abs(defAvg).toLocaleString()+'</b><span>日均</span></div><div><b>'+(defSum>=0?'−':'+')+Math.abs(defSum).toLocaleString()+'</b><span>14 日累計</span></div><div><b>'+(s.weightKg||'—')+'</b><span>體重 kg</span></div></div></div>';
    return h;
  }

  function renderWkBody(first){
    var el=$('wkbody'); if(!el) return;
    var keepMin=$('w_min')?$('w_min').value:'', keepK=$('w_kcal')?$('w_kcal').value:'', keepT=$('w_time')?$('w_time').value:nowTime();
    var st0=(wkEdit&&wkEdit.sets&&wkEdit.sets[0])||null;
    if(first&&wkEdit){ keepMin=wkEdit.minutes||''; keepK=wkEdit.kcal!=null?wkEdit.kcal:''; keepT=wkEdit.time||nowTime(); }
    var h='';
    if(wkType==='負重'){
      h+='<label>動作（撳一個）</label><div class="exchips" id="exchips">';
      allExercises().forEach(function(x){ h+='<button data-act="wex" data-zh="'+esc(x[0])+'" data-en="'+esc(x[1])+'" class="'+(wkEx&&wkEx[0]===x[0]?'on':'')+'">'+esc(x[0])+(x[1]?'<small>'+esc(x[1])+'</small>':'')+'</button>'; });
      h+='<button data-act="wex-add">＋ 其他</button></div>';
      h+='<div class="g3"><div><label>重量 kg</label><input id="w_kg" type="number" inputmode="decimal" placeholder="40" value="'+esc(first&&st0&&st0.weightKg!=null?st0.weightKg:'')+'"></div><div><label>組數</label><input id="w_sets" type="number" inputmode="numeric" placeholder="3" value="'+esc(first&&st0&&st0.sets!=null?st0.sets:'')+'"></div><div><label>每組次數</label><input id="w_reps" type="number" inputmode="numeric" placeholder="12" value="'+esc(first&&st0&&st0.reps!=null?st0.reps:'')+'"></div></div>';
    }
    var defMin = wkType==='Sixpad 腹帶' ? 23 : '';
    h+='<div class="g3"><div><label>時長（分鐘）</label><input id="w_min" type="number" inputmode="numeric" placeholder="30" value="'+esc(keepMin||defMin)+'"></div><div><label>消耗 kcal</label><input id="w_kcal" type="number" inputmode="numeric" placeholder="手錶顯示" value="'+esc(keepK)+'"></div><div><label>時間</label><input id="w_time" type="time" value="'+esc(keepT)+'"></div></div>';
    if(wkType==='負重'){ h+='<div class="est" id="est"></div><div class="hint">時長＝由第一組開始到最後一組完，連中間休息（MET 3.5 本身就係連休息計）。冇計時就用「組數 × 2 分鐘」，填組數會自動幫你填。</div>'; }
    else if(wkType==='Sixpad 腹帶'){ h+='<div class="hint">EMS 腹帶嘅耗能 Eva 查唔到可信研究數，唔估；有手錶數就入，冇就留空當 0。</div>'; }
    else { h+='<div class="hint">消耗卡數照 Apple Watch／跑步機顯示嘅數入，app 唔會自己估。</div>'; }
    el.innerHTML=h; updateEst();
  }
  function updateEst(){
    var el=$('est'); if(!el) return;
    var kg=+state.settings.weightKg||0, mins=parseFloat($('w_min')?$('w_min').value:'');
    if(!kg){ el.innerHTML='<span>要估消耗先要體重：撳 ⚙︎ 入體重 kg</span>'; return; }
    if(!(mins>0)){ el.innerHTML='<span>填時長就估到消耗（MET 3.5 × 3.5 × 體重 ÷ 200 × 分鐘）</span>'; return; }
    var est=r0(3.5*3.5*kg/200*mins);
    var kin=$('w_kcal'); if(kin && (kin.value===''||kin.getAttribute('data-est')==='1')){ kin.value=est; kin.setAttribute('data-est','1'); }
    el.innerHTML='<span>已自動填估算 <b>'+est+' kcal</b>（3.5 MET·Compendium 2011 code 02054·體重 '+kg+'kg·'+mins+' 分）。有手錶數可以直接改。</span>';
  }
  function saveWorkout(){
    var type=wkType||'其他';
    var mins=parseInt($('w_min').value,10); if(isNaN(mins)||mins<=0){ alert('填時長（分鐘）'); return; }
    var sets=[];
    if(type==='負重'){
      if(!wkEx){ alert('揀一個動作'); return; }
      var kg=$('w_kg').value, sc=parseInt($('w_sets').value,10), rp=parseInt($('w_reps').value,10);
      sets.push({exercise:wkEx[0], exerciseEn:wkEx[1]||'', weightKg:kg===''?null:parseFloat(kg), sets:isNaN(sc)?null:sc, reps:isNaN(rp)?null:rp});
    }
    var wk=parseInt($('w_kcal').value,10); if(isNaN(wk)||wk<0) wk=null;
    var rec={id:wkEdit?wkEdit.id:uid(), date:wkEdit?wkEdit.date:curDate, time:$('w_time').value||nowTime(), type:type, minutes:mins, kcal:wk, kcalSrc:(wk!=null&&$('w_kcal').getAttribute('data-est')==='1')?'MET估':(wk!=null?'手動':null), sets:sets, note:($('w_note').value||'').trim()};
    if(wkEdit){ var ix=state.workouts.findIndex(function(w){return w.id===wkEdit.id;}); if(ix>=0) state.workouts[ix]=rec; else state.workouts.push(rec); } else state.workouts.push(rec);
    wkEdit=null; markDirty(); closeSheet();
  }
  function openSettings(){
    var s=state.settings, h='<div class="hd"><h2>設定</h2><button class="close" data-act="close">✕</button></div><div class="frm">';
    h+='<div class="g2"><div><label>每日可攝取 kcal 目標</label><input id="s_k" type="number" inputmode="numeric" value="'+(s.dailyKcal||'')+'"></div><div><label>體重 kg</label><input id="s_w" type="number" inputmode="decimal" step="0.1" value="'+(s.weightKg||'')+'"></div></div>';
    h+='<div class="g2"><div><label>TDEE（每日總消耗）kcal</label><input id="s_tdee" type="number" inputmode="numeric" value="'+(s.tdee||2300)+'"></div><div><label>步長 m（估步行消耗用）</label><input id="s_stride" type="number" inputmode="decimal" step="0.01" value="'+(s.strideM||0.8)+'"></div></div>';
    h+='<div class="hint">步行消耗＝步數 × 步長 × 0.1 mL O₂/kg/m × 體重 × 5 kcal/L（ACSM 步行代謝方程·淨耗氧·平路）；赤字＝TDEE − 淨攝取。</div>';
    h+='<div class="g3"><div><label>蛋白質 g</label><input id="s_p" type="number" inputmode="numeric" value="'+(s.proteinTarget||'')+'"></div><div><label>碳水 g（可留空）</label><input id="s_c" type="number" inputmode="numeric" value="'+(s.carbTarget||'')+'"></div><div><label>脂肪 g（可留空）</label><input id="s_f" type="number" inputmode="numeric" value="'+(s.fatTarget||'')+'"></div></div>';
    h+='<label>運動項目（逗號分隔）</label><input id="s_t" value="'+esc(s.workoutTypes.join('，'))+'">';
    h+='<button class="btn" data-act="savesettings">儲存</button>';
    h+='<div class="hint">食物庫：'+BUILTIN.length+' 樣內建（每樣有來源）＋ '+state.foods.filter(function(f){return f.custom;}).length+' 樣自訂。撳食物名可睇來源。</div>';
    h+='<button class="btn ghost" data-act="logout">登出（清除本機暗號）</button></div>';
    openSheet(h);
  }
  function saveSettings(){
    var s=state.settings;
    s.dailyKcal=parseInt($('s_k').value,10)||null; s.proteinTarget=parseInt($('s_p').value,10)||null; s.weightKg=parseFloat($('s_w').value)||null; s.tdee=parseInt($('s_tdee').value,10)||2300; s.strideM=parseFloat($('s_stride').value)||0.8; s.carbTarget=parseInt($('s_c').value,10)||null; s.fatTarget=parseInt($('s_f').value,10)||null;
    var t=($('s_t').value||'').split(/[,，、]/).map(function(x){return x.trim();}).filter(Boolean); if(t.length) s.workoutTypes=t;
    markDirty(); closeSheet();
  }

  // ---------- events ----------
  document.addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var act=b.getAttribute('data-act');
    if(act==='add') openAdd(b.getAttribute('data-slot'));
    else if(act==='close') closeSheet();
    else if(act==='goday'){ curDate=b.getAttribute('data-d'); render(); }
    else if(act==='settings') openSettings();
    else if(act==='backadd') openAdd(addSlot);
    else if(act==='openfood'){ var li=b.closest('li'); var was=li.classList.contains('open'); document.querySelectorAll('.flist li.open').forEach(function(x){x.classList.remove('open');}); if(!was) li.classList.add('open'); }
    else if(act==='pick'){ var li0=b.closest('li'); var fid0=li0.getAttribute('data-food'); var gi=li0.querySelector('[data-gin]'); gi.value=b.getAttribute('data-grams'); li0.querySelectorAll('.portions button').forEach(function(x){x.classList.toggle('on', x===b);}); gi.setAttribute('data-label', b.getAttribute('data-label')); previewGrams(fid0); }
    else if(act==='pickg'){ var fid1=b.getAttribute('data-food'); var f1=foodById(fid1); var li1=b.closest('li'); var g1=parseFloat(li1.querySelector('[data-gin]').value); if(f1&&g1>0){ addItem(addSlot, f1, g1, li1.querySelector('[data-gin]').getAttribute('data-label')||g1+'g'); closeSheet(); } }
    else if(act==='showlist'){ $('flist').innerHTML=foodRows(); $('flist').hidden=false; b.hidden=true; }
    else if(act==='quick'){ var f2=foodById(b.getAttribute('data-food')); if(f2){ var lp=state.settings.lastPortion[f2.id]||{label:f2.portions[1].label, grams:f2.portions[1].grams}; addItem(addSlot, f2, lp.grams, lp.label); closeSheet(); } }
    else if(act==='copy'){ var src=getMeal(b.getAttribute('data-from'), addSlot, false); if(src){ var m=getMeal(curDate, addSlot, true); src.items.forEach(function(it){ m.items.push(JSON.parse(JSON.stringify(it))); }); markDirty(); } closeSheet(); }
    else if(act==='mealset-add'){ var st=state.sets.filter(function(x){return x.id===b.getAttribute('data-set');})[0]; if(st){ var mm2=getMeal(curDate, addSlot, true); mm2.items.push(bundleFromSet(st)); if(!mm2.time) mm2.time=nowTime(); markDirty(); } closeSheet(); }
    else if(act==='mealset-del'){ var sid='set:'+b.getAttribute('data-set'); if(confirmId===sid){ state.sets=state.sets.filter(function(x){return x.id!==b.getAttribute('data-set');}); confirmId=null; markDirty(); openAdd(addSlot); } else { confirmId=sid; openAdd(addSlot); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; },3000); } }
    else if(act==='mealset-save'){ var mm3=state.meals.filter(function(x){return x.id===b.getAttribute('data-meal');})[0]; if(mm3&&mm3.items.length){ var nm=prompt('套餐名稱', '我的'+mm3.slot+'餐'); if(nm&&nm.trim()){ state.sets.push({id:'set_'+uid(), name:nm.trim(), slot:mm3.slot, items:[].concat.apply([], mm3.items.map(function(it){ return (it.parts||[it]).map(function(x){ return {foodId:x.foodId, grams:x.grams}; }); }))}); markDirty(); } } }
    else if(act==='photo'){ $('photoIn').value=''; $('photoIn').click(); }
    else if(act==='photo-rm'){ b.closest('.g').remove(); }
    else if(act==='photo-addname'){ var d=document.createElement('div'); d.className='g'; d.style.marginTop='6px'; d.innerHTML='<input style="flex:1;width:auto" placeholder="食物名" data-pn="x"><button class="x" data-act="photo-rm">✕</button>'; $('pnames').appendChild(d); d.querySelector('input').focus(); }
    else if(act==='photo-confirm') photoStage2();
    else if(act==='nl-ai'){
      var pendRows=nlRows.filter(function(r){return r.status!=='ok';}); if(!pendRows.length) return;
      b.textContent='AI 估緊…'; b.disabled=true;
      var lib=state.foods.map(function(f){ return {id:f.id, name:f.name, aliases:f.aliases||[]}; });
      visionCall({stage:'estimate', image:photoB64||'', names:pendRows.map(function(r){return r.raw;}), foods:lib}, function(err, j){
        if(err){ alert('AI 估唔到：'+err.message); renderNl(); return; }
        (j.items||[]).forEach(function(x){
          var r=pendRows.filter(function(rr){return rr.raw===x.name;})[0] || pendRows.shift(); if(!r) return;
          var f=x.foodId?foodById(x.foodId):null; if(!f&&r.food) f=r.food; if(!f) f=findFood(String(x.name||''));
          var g=parseFloat(x.grams);
          if(f&&g>0){ r.food=f; r.grams=Math.round(g); r.status='ok'; r.how='AI 估一般份量'+(x.note?'·'+x.note:''); }
          else if(f){ r.food=f; r.status='pick'; r.reason='AI 估唔到份量，揀一個'; }
        });
        renderNl();
      });
    }
    else if(act==='nl-parse') nlParse();
    else if(act==='nl-pick'){ var rr=nlRows[+b.getAttribute('data-i')]; rr.grams=parseFloat(b.getAttribute('data-grams')); rr.status='ok'; rr.how='你揀'; renderNl(); }
    else if(act==='nl-pickg'){ var ii=+b.getAttribute('data-i'); var gv=parseFloat($('nlg'+ii).value); if(gv>0){ nlRows[ii].grams=gv; nlRows[ii].status='ok'; nlRows[ii].how='你打'; renderNl(); } }
    else if(act==='nl-add'){ var mm4=getMeal(curDate, addSlot, true); var n=0; nlRows.forEach(function(r){ if(r.status==='ok'){ mm4.items.push(makeItem(r.food, r.grams)); state.settings.lastPortion[r.food.id]={label:r.grams+'g', grams:r.grams}; n++; } }); if(n){ if(!mm4.time) mm4.time=nowTime(); markDirty(); } nlRows=[]; closeSheet(); }
    else if(act==='toggleparts'){ var c2=b.getAttribute('data-cid'); expandedId = expandedId===c2?null:c2; render(); }
    else if(act==='customfood') openCustomFood();
    else if(act==='savefood') saveCustomFood();
    else if(act==='del'){
      var mid=b.getAttribute('data-meal'), idx=+b.getAttribute('data-idx'), cid=mid+':'+idx;
      if(confirmId===cid){ var mm=state.meals.filter(function(x){return x.id===mid;})[0]; if(mm){ mm.items.splice(idx,1); if(!mm.items.length&&!mm.note) state.meals=state.meals.filter(function(x){return x.id!==mid;}); } confirmId=null; markDirty(); }
      else { confirmId=cid; render(); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; render(); },3000); }
    }
    else if(act==='addwk') openWorkout();
    else if(act==='editwk') openWorkout(b.getAttribute('data-id'));
    else if(act==='wtype'){ document.querySelectorAll('#wtypes button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); wkType=b.getAttribute('data-t'); renderWkBody(); }
    else if(act==='wtype-add'){ var nt=prompt('新項目名稱'); if(nt&&nt.trim()){ state.settings.workoutTypes.push(nt.trim()); markDirty(); openWorkout(); wkType=nt.trim(); document.querySelectorAll('#wtypes button').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-t')===wkType); }); renderWkBody(); } }
    else if(act==='wex'){ wkEx=[b.getAttribute('data-zh'), b.getAttribute('data-en')]; document.querySelectorAll('#exchips button').forEach(function(x){x.classList.toggle('on', x===b);}); }
    else if(act==='wex-add'){ var ne=prompt('動作名稱（中文，可加英文）'); if(ne&&ne.trim()){ state.settings.exercises.push(ne.trim()); markDirty(); wkEx=[ne.trim(),'']; renderWkBody(); } }
    else if(act==='useest'){ $('w_kcal').value=b.getAttribute('data-v'); $('w_kcal').setAttribute('data-est','1'); }
    else if(act==='savewk') saveWorkout();
    else if(act==='delwk'){
      var wid=b.getAttribute('data-id');
      if(confirmId===wid){ state.workouts=state.workouts.filter(function(w){return w.id!==wid;}); confirmId=null; markDirty(); }
      else { confirmId=wid; render(); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; render(); },3000); }
    }
    else if(act==='savesettings') saveSettings();
    else if(act==='logout'){ try{ localStorage.removeItem('mealKey'); localStorage.removeItem('mealCache'); }catch(e){} location.reload(); }
  });
  var stepsTimer=null;
  var stepsYTimer=null;
  document.addEventListener('input', function(e){ if(e.target&&e.target.id==='stepsYIn'){ var d=e.target.getAttribute('data-d'), v2=parseInt(e.target.value,10); if(stepsYTimer) clearTimeout(stepsYTimer); stepsYTimer=setTimeout(function(){ if(!isNaN(v2)&&v2>0){ state.steps[d]=v2; markDirty(); } }, 1200); } });
  document.addEventListener('input', function(e){ if(e.target&&e.target.id==='stepsIn'){ var v=parseInt(e.target.value,10); if(stepsTimer) clearTimeout(stepsTimer); stepsTimer=setTimeout(function(){ if(isNaN(v)||v<=0) delete state.steps[curDate]; else state.steps[curDate]=v; markDirty(); }, 900); } });
  document.addEventListener('change', function(e){
    if(e.target&&e.target.id==='photoIn'){ var fl=e.target.files&&e.target.files[0]; if(fl){ resizeImage(fl, function(b64){ if(!b64){ alert('讀唔到張相'); return; } photoB64=b64; photoStage1(); }); } return; }
    var el=e.target.closest('[data-act="note"]'); if(!el) return;
    var m=state.meals.filter(function(x){return x.id===el.getAttribute('data-meal');})[0]; if(m){ m.note=el.value.trim(); markDirty(); }
  });
  $('prevD').addEventListener('click', function(){ curDate=shiftDate(curDate,-7); render(); });
  $('nextD').addEventListener('click', function(){ curDate=shiftDate(curDate,7); render(); });
  $('dateLbl').addEventListener('click', function(){ curDate=today(); render(); });
  $('gearBtn').addEventListener('click', function(){ if(state) openSettings(); });
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.addEventListener('click', function(){ tab=b.getAttribute('data-tab'); render(); }); });
  $('sync').addEventListener('click', function(){ if(retryTimer) clearTimeout(retryTimer); boot(); });

  // 版本檢查：手機主畫面 app 會 cache 舊版，發現新版就畀個掣重載
  try{ $('ver').textContent='版本 '+APP_VER; }catch(e){}
  function checkUpdate(){
    fetch('index.html?cb='+Date.now(), {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
      var m=t.match(/APP_VER = '([^']+)'/); if(m && m[1]!==APP_VER){ $('upd').className='upd show'; }
    }).catch(function(){});
  }
  $('upd').addEventListener('click', function(){ location.replace(location.pathname+'?v='+Date.now()); });
  setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 10*60*1000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkUpdate(); });
  boot();
  setInterval(refreshIfChanged, 5000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ if(curDate!==today() && tab!=='trend'){ /* 保持用戶揀嘅日子 */ } refreshIfChanged(); } });
})();
</script>
