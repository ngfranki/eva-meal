<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>飲食記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="飲食記錄">
<meta name="theme-color" content="#FAF6EB">
<style>
  :root{
    --bg:#FAF6EB; --ink:#3B3A19; --gold:#CEB991; --warn:#C0553B; --card:#FFFFFF;
    --muted:#8A876A; --line:#E8E1CF; --soft:#F3EDDD; --gold-soft:#F1E9D6;
    --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1C1B14; --ink:#EDE8D6; --gold:#CEB991; --warn:#D4735B; --card:#26251C;
      --muted:#A39F86; --line:#3A382B; --soft:#302E22; --gold-soft:#3A3526;
      --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,"PingFang HK",sans-serif; font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom)}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0}
  .app{max-width:480px; margin:0 auto; padding:10px 14px 96px}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0 10px}
  .top h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.02em}
  .sync{font-size:12px; color:var(--muted); white-space:nowrap}
  .sync.err{color:var(--warn)}
  .sync.ok{color:var(--muted)}
  .gear{width:34px; height:34px; border-radius:10px; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:16px}
  .datenav{display:flex; align-items:center; justify-content:center; gap:6px; margin:0 0 12px}
  .datenav button{width:40px; height:36px; border-radius:10px; background:var(--card); box-shadow:var(--shadow); font-size:18px}
  .datenav .d{min-width:170px; text-align:center; font-weight:700; font-size:15px; padding:6px 10px; border-radius:10px; background:var(--card); box-shadow:var(--shadow)}
  .datenav .d small{display:block; font-weight:500; color:var(--muted); font-size:11px}
  .offline{display:none; background:var(--warn); color:#fff; font-size:13px; padding:8px 12px; border-radius:12px; margin-bottom:10px; text-align:center}
  .offline.show{display:block}

  /* cards */
  .card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .card h2{font-size:14px; margin:0 0 8px; font-weight:700; color:var(--muted); letter-spacing:.04em}

  /* summary */
  .kcal-row{display:flex; align-items:baseline; justify-content:space-between}
  .kcal-big{font-size:32px; font-weight:800; letter-spacing:-.01em}
  .kcal-big small{font-size:14px; font-weight:500; color:var(--muted); margin-left:4px}
  .kcal-target{font-size:13px; color:var(--muted)}
  .kcal-target.over{color:var(--warn); font-weight:700}
  .bar{height:10px; border-radius:6px; background:var(--soft); overflow:hidden; margin:10px 0 12px}
  .bar i{display:block; height:100%; background:var(--gold); border-radius:6px; width:0}
  .bar.over i{background:var(--warn)}
  .macros{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .macro{background:var(--soft); border-radius:12px; padding:8px 6px; text-align:center}
  .macro b{display:block; font-size:16px}
  .macro span{display:block; font-size:11px; color:var(--muted)}
  .macro .t{font-size:10px; color:var(--muted)}
  .macro.over b{color:var(--warn)}

  /* slots */
  .slot-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .slot-head h3{margin:0; font-size:16px}
  .slot-head .k{font-size:13px; color:var(--muted); margin-left:8px; font-weight:500}
  .addbtn{background:var(--gold); color:#3B3A19; font-weight:800; width:38px; height:38px; border-radius:12px; font-size:22px; line-height:1}
  .items{margin:0; padding:0; list-style:none}
  .items li{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line)}
  .items li:first-child{border-top:0}
  .items .n{flex:1; min-width:0}
  .items .n b{font-weight:600}
  .items .n span{display:block; font-size:12px; color:var(--muted)}
  .items .kc{font-weight:700; font-size:15px; white-space:nowrap}
  .x{width:32px; height:32px; border-radius:9px; color:var(--muted); font-size:16px; background:var(--soft)}
  .x.confirm{background:var(--warn); color:#fff; width:auto; padding:0 10px; font-size:13px; font-weight:700}
  .empty{color:var(--muted); font-size:13px; padding:6px 0}
  .note-in{width:100%; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--bg); font-size:14px; margin-top:8px}

  /* tabbar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20}
  .tabbar .in{display:flex; width:100%; max-width:480px}
  .tabbar button{flex:1; padding:10px 0 8px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px}
  .tabbar button i{font-style:normal; font-size:20px}
  .tabbar button.on{color:var(--ink); font-weight:700}
  .tabbar button.on i{filter:none}

  /* sheet */
  .veil{position:fixed; inset:0; background:rgba(40,35,20,.35); display:none; z-index:30}
  .veil.show{display:block}
  .sheet{position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:480px; background:var(--bg); border-radius:20px 20px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,.15); max-height:88vh; overflow:auto; padding:12px 14px calc(20px + env(safe-area-inset-bottom)); display:none; z-index:40}
  .sheet.show{display:block}
  .sheet .hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .sheet .hd h2{margin:0; font-size:17px}
  .close{width:34px; height:34px; border-radius:10px; background:var(--card); box-shadow:var(--shadow); font-size:16px}
  .sec{margin:12px 0 6px; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em}
  .quick{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .quick button{background:var(--card); box-shadow:var(--shadow); border-radius:14px; padding:12px 12px; text-align:left; min-height:60px}
  .quick button b{display:block; font-size:15px}
  .quick button span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
  .sets{display:flex; flex-direction:column; gap:8px}
  .sets .sb{display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--bg); border-radius:14px; padding:12px 14px}
  .sets .sb .t{flex:1; text-align:left}
  .sets .sb b{display:block; font-size:16px}
  .sets .sb span{font-size:12px; opacity:.75}
  .sets .sb .x{background:rgba(255,255,255,.15); color:var(--bg)}
  .savebtn{font-size:12px; color:var(--muted); padding:6px 0 0; text-decoration:underline}
  .rep{display:flex; gap:8px}
  .rep button{flex:1; background:var(--gold-soft); border-radius:12px; padding:10px; font-size:14px; font-weight:600}
  .search{width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--card); font-size:16px}
  .flist{margin:8px 0 0; padding:0; list-style:none}
  .flist li{background:var(--card); border-radius:12px; box-shadow:var(--shadow); margin-bottom:6px; overflow:hidden}
  .flist .row{display:flex; align-items:center; justify-content:space-between; padding:11px 12px; width:100%; text-align:left}
  .flist .row b{font-weight:600}
  .flist .row span{font-size:12px; color:var(--muted)}
  .flist .cat{font-size:11px; color:var(--muted); padding:8px 2px 2px; font-weight:700}
  .portions{display:none; gap:8px; padding:0 10px 10px}
  .flist li.open .portions{display:flex}
  .portions button{flex:1; background:var(--gold); color:#3B3A19; border-radius:12px; padding:12px 4px; font-weight:800; font-size:15px}
  .portions button small{display:block; font-weight:500; font-size:11px; opacity:.85}
  .src{font-size:11px; color:var(--muted); padding:0 12px 10px; display:none; word-break:break-all}
  .flist li.open .src{display:block}

  /* forms */
  .frm label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px}
  .frm input,.frm select,.frm textarea{width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card); font-size:16px}
  .frm .g2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .frm .g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .frm .g5{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .frm .g5 input{padding:8px 6px; font-size:14px}
  .btn{width:100%; background:var(--gold); color:#3B3A19; font-weight:800; border-radius:14px; padding:14px; font-size:16px; margin-top:14px}
  .btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--shadow); font-weight:600}
  .btn.warn{background:var(--warn); color:#fff}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chips button{background:var(--card); box-shadow:var(--shadow); border-radius:999px; padding:9px 14px; font-size:14px; font-weight:600}
  .chips button.on{background:var(--gold); color:#3B3A19}
  .setrow{display:grid; grid-template-columns:2fr 1fr 1fr 34px; gap:6px; margin-top:6px; align-items:center}
  .setrow input{padding:8px 8px; font-size:14px}
  .setrow .x{height:38px}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}

  /* workouts */
  .wk{display:flex; align-items:flex-start; gap:8px; padding:10px 0; border-top:1px solid var(--line)}
  .wk:first-child{border-top:0}
  .wk .n{flex:1}
  .wk .n b{font-size:15px}
  .wk .n .m{font-size:13px; color:var(--muted)}
  .wk .n .sets{font-size:13px; margin-top:4px}
  .wk .n .sets div{padding:1px 0}

  /* trends */
  .chart{display:flex; align-items:flex-end; gap:3px; height:120px; padding-top:6px; position:relative}
  .chart .c{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
  .chart .b{width:100%; background:var(--gold); border-radius:4px 4px 0 0; min-height:2px}
  .chart .b.over{background:var(--warn)}
  .chart .b.wk{background:var(--ink); opacity:.7}
  .chart .v{font-size:9px; color:var(--muted); margin-bottom:2px}
  .chart .l{font-size:9px; color:var(--muted); margin-top:4px}
  .tline{position:absolute; left:0; right:0; border-top:1px dashed var(--warn); opacity:.7}
  .tline span{position:absolute; right:0; top:-14px; font-size:10px; color:var(--warn)}
  .stat{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px}
  .stat div{background:var(--soft); border-radius:12px; padding:8px; text-align:center}
  .stat b{display:block; font-size:16px}
  .stat span{font-size:11px; color:var(--muted)}
  .gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; padding:20px}
  .gate.show{display:flex}
  .gate .box{width:100%; max-width:320px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:20px}
  .gate h2{margin:0 0 6px; font-size:18px}
  .gate p{margin:0 0 12px; font-size:13px; color:var(--muted)}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <h2>飲食記錄</h2>
    <p>輸入暗號先入到</p>
    <input class="search" id="gateKey" type="password" autocomplete="off" placeholder="暗號">
    <button class="btn" id="gateGo">進入</button>
    <div class="hint" id="gateMsg"></div>
  </div>
</div>

<div class="app">
  <div class="top">
    <h1 id="title">🍽 今日</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="sync" id="sync">載緊…</span>
      <button class="gear" id="gearBtn" title="設定">⚙︎</button>
    </div>
  </div>
  <div class="offline" id="offline">離線，資料未同步</div>
  <div class="datenav" id="datenav">
    <button id="prevD">‹</button>
    <div class="d" id="dateLbl"></div>
    <button id="nextD">›</button>
  </div>
  <div id="view"></div>
</div>

<div class="tabbar"><div class="in">
  <button data-tab="today" class="on"><i>🍽</i>今日</button>
  <button data-tab="workout"><i>🏋️</i>運動</button>
  <button data-tab="trend"><i>📊</i>趨勢</button>
</div></div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

<script>
(function(){

  var SBK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2d3Nwbmp5c2Z5b211c3p6amF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODIxMzIsImV4cCI6MjEwMTA1ODEzMn0.fmrc8DlO1UXcsLnUdhTG6IZyxv1kZEVP8jSEIQgf2d4';
  var TABLE = 'meal_log';

  var $ = function(id){ return document.getElementById(id); };
  var KEY = '';
  try{ KEY = localStorage.getItem('mealKey') || ''; }catch(e){}

  var state = null, lastUpdated = null, dirty = false, persistTimer = null, retryTimer = null;
  var tab = 'today', curDate = today(), offline = false;
  var confirmId = null, confirmTimer = null;

  // ---------- date helpers ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return fmtDate(new Date()); }
  function nowTime(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function shiftDate(s, n){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return fmtDate(d); }
  function dateLabel(s){
    var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
    var w=['日','一','二','三','四','五','六'][d.getDay()];
    var t=today(); var rel = s===t?'今日':(s===shiftDate(t,-1)?'昨日':(s===shiftDate(t,1)?'明日':''));
    return '<span>'+(+p[1])+'月'+(+p[2])+'日（'+w+'）</span><small>'+(rel||'&nbsp;')+'</small>';
  }
  function slotByHour(){ var h=new Date().getHours(); return h<10?'早':h<15?'午':h<20?'晚':'宵'; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function r0(x){ return Math.round(x); }
  function r1(x){ return Math.round(x*10)/10; }

  // ---------- state ----------
  function defaultState(){
    return { meals:[], workouts:[], sets:[], foods:BUILTIN.map(function(f){ return JSON.parse(JSON.stringify(f)); }),
      settings:{ dailyKcal:null, proteinTarget:null, weightKg:null, workoutTypes:DEFAULT_TYPES.slice(), lastPortion:{}, updatedAt:null },
      meta:{ lastSync:null } };
  }
  function applyState(row){
    var s = row.state || {};
    if(!s || typeof s!=='object' || !Array.isArray(s.meals)){ s = Object.assign(defaultState(), s||{}); }
    if(!Array.isArray(s.meals)) s.meals=[];
    if(!Array.isArray(s.workouts)) s.workouts=[];
    if(!Array.isArray(s.foods)) s.foods=[];
    if(!Array.isArray(s.sets)) s.sets=[];
    if(!s.settings) s.settings={};
    if(!Array.isArray(s.settings.workoutTypes) || !s.settings.workoutTypes.length) s.settings.workoutTypes=DEFAULT_TYPES.slice();
    if(!s.settings.lastPortion) s.settings.lastPortion={};
    if(!s.meta) s.meta={};
    // 內建食物以源碼為準（來源／數字修正會自動推過去），自訂食物保留
    var custom = s.foods.filter(function(f){ return f.custom; });
    s.foods = BUILTIN.map(function(f){ return JSON.parse(JSON.stringify(f)); }).concat(custom);
    state = s; lastUpdated = row.updated_at || null;
  }
  function cacheSave(){ try{ localStorage.setItem('mealCache', JSON.stringify({state:state, updated_at:lastUpdated})); }catch(e){} }
  function cacheLoad(){ try{ var s=localStorage.getItem('mealCache'); return s?JSON.parse(s):null; }catch(e){ return null; } }

  function setSync(cls, txt){ var el=$('sync'); el.className='sync '+(cls||''); el.textContent=txt; }
  function setOffline(on){ offline=on; $('offline').className='offline'+(on?' show':''); }

  function hdr(){ return {apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':KEY, 'Content-Type':'application/json'}; }

  function fetchRow(cb){
    var done=false, ctrl=null; try{ ctrl=new AbortController(); }catch(e){}
    var t=setTimeout(function(){ if(done) return; done=true; try{ctrl&&ctrl.abort();}catch(e){} cb(null,false); }, 12000);
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=state,updated_at', {headers:hdr(), signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(done) return; done=true; clearTimeout(t); cb(rows&&rows[0]?rows[0]:null, true); })
      .catch(function(){ if(done) return; done=true; clearTimeout(t); cb(null,false); });
  }

  function markDirty(){
    dirty=true; state.settings.updatedAt=new Date().toISOString(); cacheSave(); render();
    setSync('', '儲緊…');
    if(persistTimer) clearTimeout(persistTimer);
    persistTimer=setTimeout(persist, 600);
  }
  function persist(){
    if(!state || !KEY) return;
    var ts=new Date().toISOString(); state.meta.lastSync=ts;
    fetch(SB+'/rest/v1/'+TABLE+'?on_conflict=id', {method:'POST',
      headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=representation'}),
      body:JSON.stringify([{id:'main', state:state, updated_at:ts}])})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(rows){
      dirty=false; if(rows&&rows[0]) lastUpdated=rows[0].updated_at; cacheSave(); setOffline(false);
      setSync('ok','已儲低 '+nowTime());
    })
    .catch(function(){ setOffline(true); setSync('err','離線，資料未同步'); setTimeout(persist, 8000); });
  }
  function refreshIfChanged(){
    if(!state || dirty || !KEY) return;
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=updated_at', {headers:hdr()})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){
        setOffline(false);
        if(rows&&rows[0]&&rows[0].updated_at!==lastUpdated){
          fetchRow(function(row,reached){ if(row&&!dirty){ applyState(row); cacheSave(); render(); setSync('ok','已同步 '+nowTime()); } });
        }
      }).catch(function(){ setOffline(true); setSync('err','離線，資料未同步'); });
  }

  function boot(){
    if(!KEY){ showGate(''); return; }
    if(!state){
      var c=cacheLoad();
      if(c&&c.state){ applyState(c); render(); setSync('','上次嘅資料·更新緊…'); }
      else setSync('','載緊資料…');
    }
    fetchRow(function(row, reached){
      if(!row){
        if(!reached){
          // 連唔到 Supabase：用 cache／空 state 照開，標離線
          if(!state){ applyState({state:defaultState(), updated_at:null}); render(); }
          setOffline(true); setSync('err','離線，資料未同步');
          if(retryTimer) clearTimeout(retryTimer); retryTimer=setTimeout(boot, 10000);
          return;
        }
        // 接通但冇資料 ＝ 暗號唔啱（RLS 閂住）
        try{ localStorage.removeItem('mealKey'); }catch(e){}
        KEY=''; showGate('暗號唔啱，再入一次'); return;
      }
      applyState(row); cacheSave(); setOffline(false); setSync('ok','已同步'); render();
      if(!row.state || !Array.isArray(row.state.meals)){ markDirty(); } // 第一次：寫入初始結構
    });
  }

  // ---------- gate ----------
  function showGate(msg){ $('gate').className='gate show'; $('gateMsg').textContent=msg||''; setTimeout(function(){ try{$('gateKey').focus();}catch(e){} },50); }
  function gateGo(){
    var k=($('gateKey').value||'').trim(); if(!k) return;
    KEY=k; try{ localStorage.setItem('mealKey',KEY); }catch(e){}
    $('gate').className='gate'; $('gateKey').value=''; boot();
  }
  $('gateGo').addEventListener('click', gateGo);
  $('gateKey').addEventListener('keydown', function(e){ if(e.key==='Enter') gateGo(); });

  // ---------- food calc ----------
  function foodById(id){ for(var i=0;i<state.foods.length;i++) if(state.foods[i].id===id) return state.foods[i]; return null; }
  function makeItem(f, grams){
    var k=grams/100, p=f.per100g;
    return { foodId:f.id, name:f.name, grams:grams, kcal:r0(p.kcal*k), protein:r1(p.protein*k), carb:r1(p.carb*k), fat:r1(p.fat*k), fiber:r1(p.fiber*k) };
  }
  function mealsOn(date){ return state.meals.filter(function(m){ return m.date===date; }); }
  function totals(items){
    var t={kcal:0,protein:0,carb:0,fat:0,fiber:0};
    items.forEach(function(i){ t.kcal+=i.kcal||0; t.protein+=i.protein||0; t.carb+=i.carb||0; t.fat+=i.fat||0; t.fiber+=i.fiber||0; });
    return t;
  }
  function dayItems(date){ var a=[]; mealsOn(date).forEach(function(m){ a=a.concat(m.items||[]); }); return a; }
  function getMeal(date, slot, create){
    var ms=mealsOn(date).filter(function(m){ return m.slot===slot; });
    if(ms.length) return ms[0];
    if(!create) return null;
    var m={id:uid(), date:date, time:nowTime(), slot:slot, items:[], note:''};
    state.meals.push(m); return m;
  }
  function addItem(slot, f, grams, portionLabel){
    var m=getMeal(curDate, slot, true);
    m.items.push(makeItem(f, grams));
    if(!m.time) m.time=nowTime();
    state.settings.lastPortion[f.id]={label:portionLabel, grams:grams};
    markDirty();
  }
  function setItems(st){
    var out=[]; (st.items||[]).forEach(function(x){ var f=foodById(x.foodId); if(f) out.push(makeItem(f, x.grams)); });
    return out;
  }
  function quickFoods(){
    var since=shiftDate(today(),-30), cnt={};
    state.meals.forEach(function(m){ if(m.date>=since) (m.items||[]).forEach(function(i){ cnt[i.foodId]=(cnt[i.foodId]||0)+1; }); });
    var ids=Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; });
    DEFAULT_QUICK.forEach(function(id){ if(ids.indexOf(id)<0) ids.push(id); });
    return ids.map(foodById).filter(Boolean).slice(0,8);
  }

  function renderToday(){

    h+='<div class="kcal-target'+(over?' over':'')+'">'+(target?(over?'超出 '+r0(t.kcal-target):'目標 '+target.toLocaleString()+'·餘 '+r0(target-t.kcal)):'未設目標（⚙︎）')+'</div></div>';
    h+='<div class="bar'+(over?' over':'')+'"><i style="width:'+pct+'%"></i></div>';
    var pT=+s.proteinTarget||0;

    h+='<div class="macro"><b>'+r0(t.protein)+'<small>g</small></b><span>蛋白</span>'+(pT?'<span class="t">/ '+pT+'g</span>':'')+'</div>';
    h+='<div class="macro"><b>'+r0(t.carb)+'<small>g</small></b><span>碳水</span></div>';
    h+='<div class="macro"><b>'+r0(t.fat)+'<small>g</small></b><span>脂肪</span></div>';
    h+='<div class="macro"><b>'+r0(t.fiber)+'<small>g</small></b><span>纖維</span></div>';

    SLOTS.forEach(function(slot){

      h+='<div class="card"><div class="slot-head"><h3>'+slot+'餐'+(m&&m.time?' <span class="k">'+esc(m.time)+'</span>':'')+'<span class="k">'+(items.length?r0(st.kcal)+' kcal':'')+'</span></h3>';
      h+='<button class="addbtn" data-act="add" data-slot="'+slot+'">＋</button></div>';

  function renderWorkout(){
    var ws=state.workouts.filter(function(w){ return w.date===curDate; }).sort(function(a,b){ return (a.time||'')<(b.time||'')?-1:1; });
    var h='<div class="card"><div class="slot-head"><h3>運動<span class="k">'+(ws.length?ws.reduce(function(a,w){return a+(+w.minutes||0);},0)+' 分鐘':'')+'</span></h3><button class="addbtn" data-act="addwk">＋</button></div>';
    if(!ws.length) h+='<div class="empty">未記</div>';
    ws.forEach(function(w){
      var conf=confirmId===w.id;
      h+='<div class="wk"><div class="n"><b>'+esc(w.type)+'</b> <span class="m">'+esc(w.time||'')+' · '+(+w.minutes||0)+' 分鐘</span>';
      if(w.sets&&w.sets.length){ h+='<div class="sets">'; w.sets.forEach(function(s){ h+='<div>'+esc(s.exercise||'')+' · '+(s.weightKg!=null&&s.weightKg!==''?s.weightKg+'kg':'—')+' × '+(s.reps||'—')+'</div>'; }); h+='</div>'; }

  function renderTrend(){
    var days=[], t=today(); for(var i=13;i>=0;i--) days.push(shiftDate(t,-i));
    var s=state.settings, target=+s.dailyKcal||0, pT=+s.proteinTarget||0;
    var kc=days.map(function(d){ return totals(dayItems(d)); });
    var wk=days.map(function(d){ return state.workouts.filter(function(w){return w.date===d;}).reduce(function(a,w){return a+(+w.minutes||0);},0); });
    function chart(vals, cls, targetV, unit){
      var mx=Math.max.apply(null, vals.concat([targetV||0, 1]))*1.1, h='<div class="chart">';
      if(targetV) h+='<div class="tline" style="bottom:'+(targetV/mx*100)+'%"><span>'+targetV+unit+'</span></div>';
      vals.forEach(function(v,i){
        var over=targetV&&v>targetV&&cls==='kc';
        h+='<div class="c"><div class="v">'+(v?r0(v):'')+'</div><div class="b'+(over?' over':'')+(cls==='wk'?' wk':'')+'" style="height:'+(v/mx*100)+'%"></div><div class="l">'+(+days[i].slice(8))+'</div></div>';
      });
      return h+'</div>';
    }
    var logged=kc.filter(function(x){return x.kcal>0;});
    var avgK=logged.length?r0(logged.reduce(function(a,x){return a+x.kcal;},0)/logged.length):0;
    var avgP=logged.length?r0(logged.reduce(function(a,x){return a+x.protein;},0)/logged.length):0;
    var wkTot=wk.reduce(function(a,b){return a+b;},0), wkDays=wk.filter(function(x){return x>0;}).length;
    var h='<div class="card"><h2>近 14 日 kcal</h2>'+chart(kc.map(function(x){return x.kcal;}),'kc',target,'')+
      '<div class="stat"><div><b>'+avgK.toLocaleString()+'</b><span>有記錄日均 kcal</span></div><div><b>'+logged.length+'</b><span>有記錄日數</span></div><div><b>'+(target||'—')+'</b><span>目標</span></div></div></div>';
    h+='<div class="card"><h2>近 14 日 蛋白質（g）</h2>'+chart(kc.map(function(x){return x.protein;}),'p',pT,'g')+
      '<div class="stat"><div><b>'+avgP+'g</b><span>有記錄日均</span></div><div><b>'+(pT?pT+'g':'—')+'</b><span>目標</span></div><div><b>'+(s.weightKg||'—')+'</b><span>體重 kg（⚙︎）</span></div></div></div>';
    h+='<div class="card"><h2>近 14 日 運動分鐘</h2>'+chart(wk,'wk',0,'')+
      '<div class="stat"><div><b>'+wkTot+'</b><span>總分鐘</span></div><div><b>'+wkDays+'</b><span>有運動日數</span></div><div><b>'+(wkDays?r0(wkTot/wkDays):0)+'</b><span>每次平均</span></div></div></div>';
    return h;
  }

  function saveCustomFood(){
    var name=($('cf_name').value||'').trim(), src=($('cf_src').value||'').trim();
    var vals=['cf_k','cf_p','cf_c','cf_f','cf_fb'].map(function(id){ return parseFloat($(id).value); });

    if(vals.some(function(v){ return isNaN(v); })){ alert('五個營養值要全部填（冇就填 0）'); return; }
    if(!src){ alert('來源必填'); return; }
    var ports=[]; for(var i=0;i<3;i++){ var l=($('cf_l'+i).value||'').trim(), g=parseFloat($('cf_g'+i).value); if(l&&!isNaN(g)&&g>0) ports.push({label:l,grams:g}); }
    if(ports.length<1){ alert('至少一個份量'); return; }
    state.foods.push({id:'c_'+uid(), name:name, cat:'自訂', per100g:{kcal:vals[0],protein:vals[1],carb:vals[2],fat:vals[3],fiber:vals[4]}, portions:ports, source:src, custom:true});

  // ---------- events ----------
  document.addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var act=b.getAttribute('data-act');
    if(act==='add') openAdd(b.getAttribute('data-slot'));
    else if(act==='close') closeSheet();
    else if(act==='backadd') openAdd(addSlot);
    else if(act==='openfood'){ var li=b.closest('li'); var was=li.classList.contains('open'); document.querySelectorAll('.flist li.open').forEach(function(x){x.classList.remove('open');}); if(!was) li.classList.add('open'); }
    else if(act==='pick'){ var f=foodById(b.closest('li').getAttribute('data-food')); if(f){ addItem(addSlot, f, parseFloat(b.getAttribute('data-grams')), b.getAttribute('data-label')); closeSheet(); } }
    else if(act==='quick'){ var f2=foodById(b.getAttribute('data-food')); if(f2){ var lp=state.settings.lastPortion[f2.id]||{label:f2.portions[1].label, grams:f2.portions[1].grams}; addItem(addSlot, f2, lp.grams, lp.label); closeSheet(); } }
    else if(act==='copy'){ var src=getMeal(b.getAttribute('data-from'), addSlot, false); if(src){ var m=getMeal(curDate, addSlot, true); src.items.forEach(function(it){ m.items.push(JSON.parse(JSON.stringify(it))); }); markDirty(); } closeSheet(); }
    else if(act==='mealset-add'){ var st=state.sets.filter(function(x){return x.id===b.getAttribute('data-set');})[0]; if(st){ var mm2=getMeal(curDate, addSlot, true); setItems(st).forEach(function(it){ mm2.items.push(it); }); if(!mm2.time) mm2.time=nowTime(); markDirty(); } closeSheet(); }
    else if(act==='mealset-del'){ var sid='set:'+b.getAttribute('data-set'); if(confirmId===sid){ state.sets=state.sets.filter(function(x){return x.id!==b.getAttribute('data-set');}); confirmId=null; markDirty(); openAdd(addSlot); } else { confirmId=sid; openAdd(addSlot); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; },3000); } }
    else if(act==='mealset-save'){ var mm3=state.meals.filter(function(x){return x.id===b.getAttribute('data-meal');})[0]; if(mm3&&mm3.items.length){ var nm=prompt('套餐名稱', '我的'+mm3.slot+'餐'); if(nm&&nm.trim()){ state.sets.push({id:'set_'+uid(), name:nm.trim(), slot:mm3.slot, items:mm3.items.map(function(it){ return {foodId:it.foodId, grams:it.grams}; })}); markDirty(); } } }
    else if(act==='customfood') openCustomFood();
    else if(act==='savefood') saveCustomFood();
    else if(act==='del'){
      var mid=b.getAttribute('data-meal'), idx=+b.getAttribute('data-idx'), cid=mid+':'+idx;
      if(confirmId===cid){ var mm=state.meals.filter(function(x){return x.id===mid;})[0]; if(mm){ mm.items.splice(idx,1); if(!mm.items.length&&!mm.note) state.meals=state.meals.filter(function(x){return x.id!==mid;}); } confirmId=null; markDirty(); }
      else { confirmId=cid; render(); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; render(); },3000); }
    }
    else if(act==='addwk') openWorkout();
    else if(act==='wtype'){ document.querySelectorAll('#wtypes button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); }
    else if(act==='wtype-add'){ var nt=prompt('新項目名稱'); if(nt&&nt.trim()){ state.settings.workoutTypes.push(nt.trim()); markDirty(); openWorkout(); document.querySelectorAll('#wtypes button').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-t')===nt.trim()); }); } }
    else if(act==='addset'){ var rows=document.querySelectorAll('#sets .setrow'); var last=rows[rows.length-1]; addSetRow(last?{ex:last.querySelector('.s_ex').value, kg:last.querySelector('.s_kg').value, rp:last.querySelector('.s_rp').value}:null); }
    else if(act==='rmset'){ b.closest('.setrow').remove(); }
    else if(act==='savewk') saveWorkout();
    else if(act==='delwk'){
      var wid=b.getAttribute('data-id');
      if(confirmId===wid){ state.workouts=state.workouts.filter(function(w){return w.id!==wid;}); confirmId=null; markDirty(); }
      else { confirmId=wid; render(); clearTimeout(confirmTimer); confirmTimer=setTimeout(function(){ confirmId=null; render(); },3000); }
    }
    else if(act==='savesettings') saveSettings();
    else if(act==='logout'){ try{ localStorage.removeItem('mealKey'); localStorage.removeItem('mealCache'); }catch(e){} location.reload(); }
  });
  document.addEventListener('change', function(e){
    var el=e.target.closest('[data-act="note"]'); if(!el) return;
    var m=state.meals.filter(function(x){return x.id===el.getAttribute('data-meal');})[0]; if(m){ m.note=el.value.trim(); markDirty(); }
  });
  $('prevD').addEventListener('click', function(){ curDate=shiftDate(curDate,-1); render(); });
  $('nextD').addEventListener('click', function(){ curDate=shiftDate(curDate,1); render(); });
  $('dateLbl').addEventListener('click', function(){ curDate=today(); render(); });
  $('gearBtn').addEventListener('click', function(){ if(state) openSettings(); });
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.addEventListener('click', function(){ tab=b.getAttribute('data-tab'); render(); }); });
  $('sync').addEventListener('click', function(){ if(retryTimer) clearTimeout(retryTimer); boot(); });

  boot();
  setInterval(refreshIfChanged, 5000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ if(curDate!==today() && tab!=='trend'){ /* 保持用戶揀嘅日子 */ } refreshIfChanged(); } });
})();
</script>
</body>
</html>
